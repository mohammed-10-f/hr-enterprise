<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HR Enterprise</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="app">
    <section id="login" class="login-shell">
      <div class="login-card">
        <div class="brand">HR <span>Enterprise</span></div>
        <h1>تسجيل الدخول</h1>
        <p class="muted">منصة الموارد البشرية والمعاملات المؤسسية</p>
        <form id="loginForm">
          <label>معرّف الشركة<input id="companyIdentifier" autocomplete="organization" required placeholder="DEMO"></label>
          <label>رقم الهوية / المستخدم<input id="userIdentifier" autocomplete="username" required></label>
          <label>كلمة المرور<input id="password" type="password" autocomplete="current-password" required></label>
          <button>دخول</button>
          <div id="loginError" class="error"></div>
        </form>
      </div>
    </section>

    <section id="shell" class="hidden">
      <aside class="sidebar">
        <div class="brand">HR <span>Enterprise</span></div>
        <div id="tenantName" class="tenant"></div>
        <nav>
          <button data-page="dashboard">لوحة التحكم</button>
          <button data-page="employees">الموظفون</button>
          <button data-page="organization">الهيكل التنظيمي</button>
          <button data-page="transactions">المعاملات</button>
          <button data-page="payroll">الرواتب</button>
          <button data-page="reports">التقارير</button>
          <button data-page="administration">الإدارة</button>
        </nav>
        <button id="logout" class="logout">تسجيل الخروج</button>
      </aside>
      <main>
        <header><div id="pageTitle">لوحة التحكم</div><div id="userBadge"></div></header>
        <div id="content"></div>
      </main>
    </section>
  </div>
<script src="/app.js" type="module"></script>
</body>
</html>
